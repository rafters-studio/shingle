packages:
  - sites/*
  - packages/*
configDependencies:
  '@rafters/toolchain': 0.1.2
# Kept over the toolchain's typescript ^7.0.2: astro check cannot run on TypeScript 7, which does
# not ship the programmatic API @astrojs/language-server drives.
catalog:
  '@rafters/toolchain': ^0.1.2
  typescript: ^5.9.3
allowBuilds:
  '@tailwindcss/oxide': true
  bufferutil: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
  lefthook: false
minimumReleaseAgeExclude:
  - '@rafters/astro-meta@0.3.0'
  - '@rafters/toolchain'
