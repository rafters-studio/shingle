packages:
  - sites/*
  - packages/*
configDependencies:
  '@rafters/toolchain': 0.1.1
# Kept over the toolchain's typescript ^7.0.2: on 7, tsc rejects baseUrl in the shared tsconfig
# (TS5102), and @astrojs/check peers on typescript ^5 or ^6.
catalog:
  typescript: ^5.9.3
allowBuilds:
  '@tailwindcss/oxide': true
  bufferutil: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
  lefthook: false
minimumReleaseAgeExclude:
  - '@rafters/astro-meta@0.3.0'
  - '@rafters/toolchain@0.1.1'
