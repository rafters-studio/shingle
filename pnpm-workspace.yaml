packages:
  - sites/*
  - packages/*
configDependencies:
  '@rafters/toolchain': 0.1.4
catalog:
  '@rafters/toolchain': ^0.1.4
allowBuilds:
  '@tailwindcss/oxide': true
  bufferutil: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
  lefthook: false
minimumReleaseAgeExclude:
  - '@rafters/astro-meta@0.4.0'
  - '@rafters/toolchain'
