name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build sites sequentially (Cloudflare workerd port conflict)
        run: pnpm -r --if-present --workspace-concurrency=1 build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    # Playwright does not support chromium on ubuntu-latest (Ubuntu 26.04), so
    # the job runs in the official Playwright image, which carries chromium and
    # its system libraries on Ubuntu 24.04 (#179). The tag must equal the
    # lockfile's @playwright/test version; the first step checks that.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - name: Check the Playwright image matches the lockfile
        run: |
          image_version="$(sed -n 's/^ *image: mcr\.microsoft\.com\/playwright:v\(.*\)-noble$/\1/p' .github/workflows/ci.yml)"
          lock_version="$(sed -n "s/^  '@playwright\/test@\([^']*\)':\$/\1/p" pnpm-lock.yaml | head -n 1)"
          if [ "$image_version" != "$lock_version" ]; then
            echo "Playwright image is v$image_version but pnpm-lock.yaml has @playwright/test $lock_version; update the image tag in .github/workflows/ci.yml"
            exit 1
          fi
          echo "Playwright image v$image_version matches @playwright/test $lock_version"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build sites for preview
        run: pnpm -r --if-present --workspace-concurrency=1 build
      - name: Run E2E tests
        working-directory: sites/sean.silvius.me
        run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: sites/sean.silvius.me/playwright-report
          retention-days: 7
