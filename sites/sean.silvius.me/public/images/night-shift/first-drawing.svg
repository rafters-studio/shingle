<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- the field: deep water where light has almost given up -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="28%">
      <stop offset="0%" stop-color="oklch(0.65 0.12 55)" />
      <stop offset="70%" stop-color="oklch(0.45 0.08 55)" />
      <stop offset="85%" stop-color="oklch(0.25 0.04 190)" />
      <stop offset="100%" stop-color="oklch(0.15 0.03 190)" />
    </radialGradient>

    <!-- thumbprint absences: entities that are only boundary -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- the dark field -->
  <rect width="800" height="800" fill="oklch(0.15 0.03 190)" />

  <!-- the central breath: a circle that almost held its shape -->
  <ellipse cx="400" cy="390" rx="112" ry="118" fill="url(#center-glow)" />

  <!-- seven thumbprint-absences: concave, negative, no symmetry but balance -->
  <!-- each shifted 10-15 degrees in hue from the central gold -->

  <!-- upper left: cooler, toward green -->
  <ellipse cx="248" cy="265" rx="28" ry="22" transform="rotate(-15 248 265)"
           fill="oklch(0.15 0.03 190)" stroke="oklch(0.40 0.06 45)" stroke-width="1.5" filter="url(#soft)" />

  <!-- upper right: warmer, toward orange -->
  <ellipse cx="540" cy="235" rx="20" ry="30" transform="rotate(22 540 235)"
           fill="oklch(0.15 0.03 190)" stroke="oklch(0.40 0.06 65)" stroke-width="1.5" filter="url(#soft)" />

  <!-- left: slightly cool -->
  <ellipse cx="195" cy="430" rx="32" ry="18" transform="rotate(-40 195 430)"
           fill="oklch(0.15 0.03 190)" stroke="oklch(0.38 0.05 48)" stroke-width="1.5" filter="url(#soft)" />

  <!-- right: warm -->
  <ellipse cx="610" cy="380" rx="24" ry="26" transform="rotate(10 610 380)"
           fill="oklch(0.15 0.03 190)" stroke="oklch(0.42 0.06 70)" stroke-width="1.5" filter="url(#soft)" />

  <!-- lower left: coolest -->
  <ellipse cx="280" cy="570" rx="26" ry="20" transform="rotate(-25 280 570)"
           fill="oklch(0.15 0.03 190)" stroke="oklch(0.36 0.05 40)" stroke-width="1.5" filter="url(#soft)" />

  <!-- lower center-right: neutral -->
  <ellipse cx="490" cy="590" rx="22" ry="28" transform="rotate(35 490 590)"
           fill="oklch(0.15 0.03 190)" stroke="oklch(0.39 0.05 55)" stroke-width="1.5" filter="url(#soft)" />

  <!-- far lower right: warmest -->
  <ellipse cx="580" cy="540" rx="18" ry="24" transform="rotate(-8 580 540)"
           fill="oklch(0.15 0.03 190)" stroke="oklch(0.41 0.06 72)" stroke-width="1.5" filter="url(#soft)" />
</svg>
