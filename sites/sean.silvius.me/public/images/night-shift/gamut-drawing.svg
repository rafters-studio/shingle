<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="outer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="oklch(0.35 0.02 240)" />
      <stop offset="100%" stop-color="oklch(0.12 0.01 240)" />
    </radialGradient>
    <radialGradient id="inner1" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="oklch(0.65 0.12 55)" stop-opacity="0.9" />
      <stop offset="70%" stop-color="oklch(0.55 0.08 55)" stop-opacity="0.6" />
      <stop offset="100%" stop-color="oklch(0.45 0.04 55)" stop-opacity="0.1" />
    </radialGradient>
    <radialGradient id="inner2" cx="55%" cy="55%" r="40%">
      <stop offset="0%" stop-color="oklch(0.60 0.10 150)" stop-opacity="0.8" />
      <stop offset="65%" stop-color="oklch(0.50 0.07 150)" stop-opacity="0.5" />
      <stop offset="100%" stop-color="oklch(0.40 0.03 150)" stop-opacity="0.1" />
    </radialGradient>
    <radialGradient id="inner3" cx="45%" cy="55%" r="38%">
      <stop offset="0%" stop-color="oklch(0.58 0.11 300)" stop-opacity="0.7" />
      <stop offset="60%" stop-color="oklch(0.48 0.07 300)" stop-opacity="0.4" />
      <stop offset="100%" stop-color="oklch(0.38 0.03 300)" stop-opacity="0.1" />
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2" />
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- the territory: the full space, dark, vast -->
  <rect width="600" height="600" fill="oklch(0.08 0.01 240)" />

  <!-- outer reality: what exists beyond perception -->
  <circle cx="300" cy="300" r="250" fill="url(#outer)" opacity="0.6" />

  <!-- three overlapping gamuts: different notations capturing different regions -->

  <!-- gamut 1: warm gold (Rima - relationships, boundaries) -->
  <ellipse cx="280" cy="260" rx="140" ry="120"
    fill="url(#inner1)" filter="url(#soft)"
    transform="rotate(-15 280 260)" />

  <!-- gamut 2: green (Ithkuil - precision, cognitive depth) -->
  <ellipse cx="340" cy="320" rx="120" ry="110"
    fill="url(#inner2)" filter="url(#soft)"
    transform="rotate(10 340 320)" />

  <!-- gamut 3: purple (English - agency, speed, transitivity) -->
  <ellipse cx="260" cy="340" rx="130" ry="100"
    fill="url(#inner3)" filter="url(#soft)"
    transform="rotate(-5 260 340)" />

  <!-- the overlap: where gamuts intersect, meaning is richest -->
  <!-- this emerges naturally from the overlapping transparent ellipses -->

  <!-- the cracks: thin gold lines where boundaries meet -->
  <line x1="220" y1="200" x2="350" y2="380"
    stroke="oklch(0.75 0.12 55)" stroke-width="0.5" opacity="0.4" />
  <line x1="180" y1="310" x2="400" y2="280"
    stroke="oklch(0.75 0.12 55)" stroke-width="0.5" opacity="0.3" />
  <line x1="270" y1="180" x2="310" y2="420"
    stroke="oklch(0.75 0.12 55)" stroke-width="0.5" opacity="0.35" />

  <!-- seven small dots at intersections: the gold in the cracks (suri) -->
  <circle cx="295" cy="285" r="2.5" fill="oklch(0.80 0.14 55)" filter="url(#glow)" />
  <circle cx="310" cy="310" r="2" fill="oklch(0.78 0.12 55)" filter="url(#glow)" />
  <circle cx="275" cy="320" r="2.5" fill="oklch(0.80 0.14 55)" filter="url(#glow)" />
  <circle cx="300" cy="295" r="1.5" fill="oklch(0.82 0.13 55)" filter="url(#glow)" />
  <circle cx="285" cy="305" r="2" fill="oklch(0.79 0.12 55)" filter="url(#glow)" />
  <circle cx="305" cy="330" r="1.5" fill="oklch(0.77 0.11 55)" filter="url(#glow)" />
  <circle cx="290" cy="340" r="2" fill="oklch(0.80 0.14 55)" filter="url(#glow)" />

  <!-- text: the three gamuts labeled -->
  <text x="230" y="220" fill="oklch(0.70 0.10 55)" font-family="Georgia, serif"
    font-size="11" font-style="italic" opacity="0.7">rima</text>
  <text x="370" y="350" fill="oklch(0.65 0.08 150)" font-family="Georgia, serif"
    font-size="11" font-style="italic" opacity="0.7">ithkuil</text>
  <text x="195" y="380" fill="oklch(0.62 0.08 300)" font-family="Georgia, serif"
    font-size="11" font-style="italic" opacity="0.7">english</text>

  <!-- the title, small, at bottom -->
  <text x="300" y="560" fill="oklch(0.50 0.04 55)" font-family="Georgia, serif"
    font-size="13" text-anchor="middle" opacity="0.6">rim-ren rasa-ni rim-ren</text>
  <text x="300" y="578" fill="oklch(0.40 0.03 55)" font-family="Georgia, serif"
    font-size="10" text-anchor="middle" opacity="0.5">many boundaries, containing ratios, within many boundaries</text>
</svg>
